<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anotador de Detalles | Exp 04.2</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #0b0f17;
      color: #f8fafc;
      user-select: none;
    }
    .btn-hud:active {
      transform: scale(0.92);
    }
    .btn-hud {
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col font-sans">

  <!-- TOP BAR WITH FILTER TABS -->
  <header class="h-14 px-8 flex items-center justify-between border-b border-slate-800/80 bg-slate-900/90 backdrop-blur-md">
    <div class="flex items-center gap-3">
      <span class="font-bold text-xs tracking-wider text-amber-400 font-mono flex items-center gap-1.5">
        <span>⚡</span> MODO DETALLES & AJUSTES
      </span>
      <span id="char-label" class="px-3 py-0.5 rounded bg-amber-500/10 text-amber-300 border border-amber-500/30 font-serif text-lg font-bold">
        -
      </span>
      <span id="id-label" class="text-xs text-slate-500 font-mono"></span>
    </div>

    <!-- FILTER TABS -->
    <div class="flex items-center gap-1.5 bg-slate-950 p-1 rounded-lg border border-slate-800 text-xs font-mono">
      <button onclick="setFilter('tweaks')" id="tab-tweaks" class="px-3 py-1 rounded-md bg-amber-500 text-slate-950 font-bold transition flex items-center gap-1.5 shadow-sm">
        <span>⚡</span> Con Detalle (<span id="tab-count-tweaks">0</span>)
      </button>
      <button onclick="setFilter('rejected')" id="tab-rejected" class="px-3 py-1 rounded-md text-slate-400 hover:text-rose-400 transition flex items-center gap-1.5">
        <span>✕</span> Rechazados (<span id="tab-count-rejected">0</span>)
      </button>
      <button onclick="setFilter('approved')" id="tab-approved" class="px-3 py-1 rounded-md text-slate-400 hover:text-emerald-400 transition flex items-center gap-1.5">
        <span>✓</span> Aprobados (<span id="tab-count-approved">0</span>)
      </button>
      <button onclick="setFilter('all')" id="tab-all" class="px-3 py-1 rounded-md text-slate-400 hover:text-white transition">
        Todos (103)
      </button>
    </div>

    <!-- PROGRESS COUNTER -->
    <div class="flex items-center gap-4 text-xs font-mono">
      <span class="text-slate-400">Progreso en este filtro:</span>
      <span id="counter-label" class="font-bold text-white text-sm">0 / 0</span>
    </div>
  </header>

  <!-- MAIN SPLIT VIEW (LEFT: ORIGINAL | RIGHT: SVG) -->
  <main class="flex-1 relative flex flex-row overflow-hidden pb-28">

    <!-- LEFT: ORIGINAL GLYPH (50%) -->
    <div class="w-1/2 h-full bg-[#131926] border-r border-slate-800/80 flex flex-col items-center justify-center p-8 relative">
      <span class="absolute top-4 left-6 text-[11px] font-bold text-slate-400 tracking-wider font-mono">
        ORIGINAL (PLUMA COLOANE)
      </span>
      <div class="w-full h-full max-w-[500px] max-h-[500px] bg-slate-900/60 rounded-2xl border border-slate-800 flex items-center justify-center p-6 shadow-inner">
        <img id="img-original" src="" alt="Glifo Original" class="max-w-full max-h-full object-contain rounded drop-shadow-md" />
      </div>
    </div>

    <!-- RIGHT: SVG VECTOR (50%) -->
    <div class="w-1/2 h-full bg-slate-950 flex flex-col items-center justify-center p-8 relative">
      <span class="absolute top-4 left-6 text-[11px] font-bold text-slate-400 tracking-wider font-mono">
        SVG VECTORIAL
      </span>
      <!-- Pure White Canvas with Black SVG -->
      <div class="w-full h-full max-w-[500px] max-h-[500px] bg-white rounded-2xl border border-slate-200 flex items-center justify-center p-6 shadow-2xl">
        <div id="svg-container" class="w-full h-full flex items-center justify-center [&>svg]:max-w-full [&>svg]:max-h-full">
          <!-- Injected SVG -->
        </div>
      </div>
    </div>

    <!-- FLOATING BOTTOM HUD WITH 3 ACTION BUTTONS + COMMENT FIELD -->
    <div class="absolute inset-x-0 bottom-3 flex items-center justify-center pointer-events-none px-6">
      <div class="pointer-events-auto w-full max-w-4xl bg-slate-900/95 backdrop-blur-md border border-slate-700/80 rounded-2xl p-3.5 flex flex-col gap-2.5 shadow-2xl">
        
        <!-- ROW 1: 3 DIRECT ACTION BUTTONS (APROBAR, CON DETALLE, RECHAZAR) + NAV -->
        <div class="flex items-center justify-between gap-3">
          
          <!-- PREV BUTTON -->
          <button onclick="prevGlyph()" title="Glifo anterior (Flecha Izquierda)" class="btn-hud w-10 h-11 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center border border-slate-700 flex-shrink-0">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
          </button>

          <!-- 3 DECISION BUTTONS -->
          <div class="flex-1 grid grid-cols-3 gap-3">
            
            <!-- APROBAR -->
            <button onclick="submitEvaluation('approved')" id="btn-approve" class="btn-hud py-2.5 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm flex items-center justify-center gap-2 shadow-lg shadow-emerald-900/30">
              <span class="text-base">✓</span>
              <span>Aprobar</span>
              <kbd class="px-1.5 py-0.5 rounded bg-black/20 text-[10px] font-mono">1</kbd>
            </button>

            <!-- CON DETALLE -->
            <button onclick="submitEvaluation('tweaks')" id="btn-tweak" class="btn-hud py-2.5 px-4 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-sm flex items-center justify-center gap-2 shadow-lg shadow-amber-900/30">
              <span class="text-base">⚡</span>
              <span>Con Detalle</span>
              <kbd class="px-1.5 py-0.5 rounded bg-slate-950/20 text-[10px] font-mono">2</kbd>
            </button>

            <!-- RECHAZAR -->
            <button onclick="submitEvaluation('rejected')" id="btn-reject" class="btn-hud py-2.5 px-4 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-bold text-sm flex items-center justify-center gap-2 shadow-lg shadow-rose-900/30">
              <span class="text-base">✕</span>
              <span>Rechazar</span>
              <kbd class="px-1.5 py-0.5 rounded bg-black/20 text-[10px] font-mono">3</kbd>
            </button>

          </div>

          <!-- NEXT BUTTON -->
          <button onclick="nextGlyph()" title="Glifo siguiente (Flecha Derecha)" class="btn-hud w-10 h-11 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center border border-slate-700 flex-shrink-0">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
          </button>

        </div>

        <!-- ROW 2: OPTIONAL DETAIL / COMMENT INPUT -->
        <div class="flex items-center gap-2 pt-1 border-t border-slate-800/80">
          <input 
            type="text" 
            id="detail-input" 
            placeholder="Nota o comentario opcional sobre este glifo v2 (ej: bucle ok pero adelgazar extremo)..." 
            class="flex-1 bg-slate-950/80 border border-slate-700 focus:border-amber-400 rounded-lg px-3 py-1.5 text-xs text-white placeholder-slate-500 focus:outline-none font-sans"
            autocomplete="off"
          />
          <!-- QUICK CHIPS -->
          <button onclick="addQuickChip('Unir trazo')" class="text-[11px] px-2 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700">🔗 Unir</button>
          <button onclick="addQuickChip('Eliminar mota')" class="text-[11px] px-2 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700">🧹 Mota</button>
          <button onclick="addQuickChip('Suavizar bordes')" class="text-[11px] px-2 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700">〰️ Suavizar</button>
        </div>

      </div>
    </div>

    <!-- EMPTY / COMPLETED STATE -->
    <div id="empty-screen" class="absolute inset-0 bg-slate-950/95 backdrop-blur-md flex flex-col items-center justify-center p-8 hidden z-50">
      <div class="w-16 h-16 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 flex items-center justify-center text-3xl mb-4">
        ✓
      </div>
      <h2 class="text-xl font-bold text-white mb-2">¡Todos los glifos de este filtro han sido evaluados!</h2>
      <p class="text-slate-400 text-xs mb-6 font-mono">Puedes revisar otra categoría usando las pestañas superiores.</p>
      <div class="flex items-center gap-3">
        <button onclick="setFilter('tweaks')" class="px-4 py-2 rounded-xl bg-amber-500 text-slate-950 font-bold text-xs font-mono hover:bg-amber-400 transition">
          Ver Con Detalle
        </button>
        <button onclick="setFilter('approved')" class="px-4 py-2 rounded-xl bg-emerald-600 text-white font-bold text-xs font-mono hover:bg-emerald-500 transition">
          Ver Aprobados
        </button>
        <button onclick="setFilter('all')" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-white text-xs font-mono transition">
          Ver Todos
        </button>
      </div>
    </div>

  </main>

  <script>
    let allGlyphs = [];
    let currentFilterGlyphs = [];
    let currentIndex = 0;
    let activeFilter = 'tweaks'; // Default to tweaks per user request
    let stats = { approved: 0, tweaks: 0, rejected: 0 };

    async function init() {
      try {
        const res = await fetch('/api/dataset');
        const data = await res.json();
        allGlyphs = data.glyphs || [];
        stats = data.stats || { approved: 0, tweaks: 0, rejected: 0 };
        
        updateTabCounts();
        applyFilter(activeFilter);
        setupShortcuts();
      } catch (e) {
        console.error("Error al cargar dataset:", e);
      }
    }

    function updateTabCounts() {
      document.getElementById('tab-count-tweaks').innerText = stats.tweaks || 0;
      document.getElementById('tab-count-rejected').innerText = stats.rejected || 0;
      document.getElementById('tab-count-approved').innerText = stats.approved || 0;
    }

    function setFilter(filter) {
      activeFilter = filter;
      
      // Update Tab Styles
      ['tweaks', 'rejected', 'approved', 'all'].forEach(tab => {
        const btn = document.getElementById(`tab-${tab}`);
        if (!btn) return;
        if (tab === filter) {
          if (tab === 'tweaks') btn.className = "px-3 py-1 rounded-md bg-amber-500 text-slate-950 font-bold transition flex items-center gap-1.5 shadow-sm";
          else if (tab === 'rejected') btn.className = "px-3 py-1 rounded-md bg-rose-600 text-white font-bold transition flex items-center gap-1.5 shadow-sm";
          else if (tab === 'approved') btn.className = "px-3 py-1 rounded-md bg-emerald-600 text-white font-bold transition flex items-center gap-1.5 shadow-sm";
          else btn.className = "px-3 py-1 rounded-md bg-indigo-600 text-white font-bold transition";
        } else {
          btn.className = "px-3 py-1 rounded-md text-slate-400 hover:text-white transition flex items-center gap-1.5";
        }
      });

      applyFilter(filter);
    }

    function applyFilter(filter) {
      if (filter === 'tweaks') {
        currentFilterGlyphs = allGlyphs.filter(g => g.evaluation?.status in {'tweaks':1, 'warning':1});
      } else if (filter === 'rejected') {
        currentFilterGlyphs = allGlyphs.filter(g => g.evaluation?.status === 'rejected');
      } else if (filter === 'approved') {
        currentFilterGlyphs = allGlyphs.filter(g => g.evaluation?.status === 'approved');
      } else {
        currentFilterGlyphs = [...allGlyphs];
      }

      currentIndex = 0;
      renderCurrent();
    }

    function renderCurrent() {
      const emptyScreen = document.getElementById('empty-screen');
      if (currentFilterGlyphs.length === 0) {
        emptyScreen.classList.remove('hidden');
        document.getElementById('counter-label').innerText = '0 / 0';
        return;
      }

      if (currentIndex >= currentFilterGlyphs.length) {
        emptyScreen.classList.remove('hidden');
        return;
      }

      emptyScreen.classList.add('hidden');
      const g = currentFilterGlyphs[currentIndex];

      // Headers
      document.getElementById('char-label').innerText = g.character || '?';
      document.getElementById('id-label').innerText = g.id;
      document.getElementById('counter-label').innerText = `${currentIndex + 1} / ${currentFilterGlyphs.length}`;

      // Left: Original Crop
      const img = document.getElementById('img-original');
      img.src = `/crops/${g.crop_file}?t=${Date.now()}`;

      // Right: SVG Vector
      const svgContainer = document.getElementById('svg-container');
      if (g.svg_content) {
        svgContainer.innerHTML = g.svg_content;
      } else {
        svgContainer.innerHTML = `<img src="/svg/${g.svg_file}?t=${Date.now()}" class="max-h-full max-w-full object-contain" />`;
      }

      // Input Field
      const input = document.getElementById('detail-input');
      input.value = g.evaluation?.notes || '';
      input.focus();
    }

    async function submitEvaluation(status) {
      if (currentIndex >= currentFilterGlyphs.length) return;
      const g = currentFilterGlyphs[currentIndex];
      const note = document.getElementById('detail-input').value.trim();

      // Update local state
      if (!g.evaluation) g.evaluation = {};
      const oldStatus = g.evaluation.status;
      g.evaluation.status = status;
      g.evaluation.notes = note;

      // Update counters locally
      if (oldStatus && stats[oldStatus] !== undefined) stats[oldStatus] = Math.max(0, stats[oldStatus] - 1);
      if (stats[status] !== undefined) stats[status] = (stats[status] || 0) + 1;
      updateTabCounts();

      // Send to server
      fetch('/api/save_evaluation', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          glyph_id: g.id,
          status: status,
          notes: note
        })
      }).catch(e => console.error("Error al guardar evaluación:", e));

      // Visual flash feedback on button
      const btnId = status === 'approved' ? 'btn-approve' : (status === 'tweaks' ? 'btn-tweak' : 'btn-reject');
      const btn = document.getElementById(btnId);
      if (btn) {
        btn.classList.add('ring-2', 'ring-white', 'scale-95');
        setTimeout(() => btn.classList.remove('ring-2', 'ring-white', 'scale-95'), 150);
      }

      // Advance
      currentIndex++;
      renderCurrent();
    }

    function addQuickChip(text) {
      const input = document.getElementById('detail-input');
      if (input.value.trim().length > 0) {
        input.value += `, ${text}`;
      } else {
        input.value = text;
      }
      input.focus();
    }

    function prevGlyph() {
      if (currentIndex > 0) {
        currentIndex--;
        renderCurrent();
      }
    }

    function nextGlyph() {
      if (currentIndex < currentFilterGlyphs.length - 1) {
        currentIndex++;
        renderCurrent();
      }
    }

    function setupShortcuts() {
      const input = document.getElementById('detail-input');
      
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          // If note is written, submit as tweaks; if empty, submit as approved
          if (input.value.trim().length > 0) {
            submitEvaluation('tweaks');
          } else {
            submitEvaluation('approved');
          }
        }
      });

      window.addEventListener('keydown', (e) => {
        if (document.activeElement === input) {
          if (e.key === 'Escape') input.blur();
          return;
        }

        if (e.key === '1') {
          e.preventDefault();
          submitEvaluation('approved');
        } else if (e.key === '2') {
          e.preventDefault();
          submitEvaluation('tweaks');
        } else if (e.key === '3') {
          e.preventDefault();
          submitEvaluation('rejected');
        } else if (e.key === 'ArrowLeft') {
          e.preventDefault();
          prevGlyph();
        } else if (e.key === 'ArrowRight') {
          e.preventDefault();
          nextGlyph();
        }
      });
    }

    window.onload = init;
  </script>
</body>
</html>
